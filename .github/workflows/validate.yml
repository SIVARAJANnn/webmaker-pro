name: Validate package
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: npm-shrinkwrap.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run check:types
      - run: npm run check:docs
      - run: npm ci --prefix templates/product-showcase --ignore-scripts
      - run: npm run build --prefix templates/product-showcase
